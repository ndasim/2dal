    <script>
      $(document).ready(function () {
        console.log("ready!");

        refreshHistoryArea();

        $("#loading").hide();
        $(".copy").hide();

        $(".copy").click(function () {
          copyToClipboard($("#longUrl").val());
        });

        $(".shorten").click(function () {
          const longUrl = $("#longUrl").val();
          let anyError = false;

          if (longUrl === "") {
            showError("Please enter a URL!");
          } else if (!longUrl.match(/^(https?:\/\/)?[-a-zA-Z0-9@:%._\+~#=]{1,256}\.[a-zA-Z0-9()]{1,6}\b([-a-zA-Z0-9()@:%_\+.~#?&//=]*)$/)) {
            showError("This URL is not valid!");
          } else if (!longUrl.includes(".")) {
            showError("This URL is not valid!");
          }else if (longUrl.length < 9) {
            showError("This URL is too short to shorten! Better use it as it is.");
          } else if (longUrl.length > 2048) {
            showError("This URL is too long!");
          } else if (longUrl.includes("2d.al")) {
            showError("You can't shorten a shortened URL!");
          }

          function showError(message) {
            anyError = true;
            $("#longUrl").addClass("is-invalid");
            $("#alertMessage").text(message);
            $("#alert").addClass("show");

            setTimeout(function () {
              $("#alert").removeClass("show");
            }, 3000);
          }

          if(anyError){
            return;
          }

          // Show loading
          $("#loading").show();

          // Disable input and button
          $("#longUrl").prop("disabled", true);
          $(".shorten").prop("disabled", true);
          
          // Get base url
          var baseUrl = window.location.origin;

          // Send request to api base_url
          $.get({
            url: baseUrl + "/api/create",
            data: {
              url: "https://" + $("#longUrl").val().replace("http://", "").replace("https://", ""),
            },
            headers: {
              "X-RapidAPI-User": "web",
              "X-RapidAPI-Subscription": "PRO",
              "X-Forwarded-For": "23",
            },
            contentType: "application/json; charset=utf-8",
            dataType: "json",
            success: function (data) {
              $("#loading").hide();
              console.log(data);

              // Show shortened url
              $("#longUrl").val(data.short_url);

              // Show copy button
              $(".copy").show();
              $(".shorten").hide();
              
              // Show alert
              $("#successtMessage").text("Shortened & Copied!");
              $("#success").addClass("show");

              // Disappear alert after 3 seconds
              setTimeout(function () {
                $("#success").removeClass("show");
              }, 3000);

              // Enable input and button
              $("#longUrl").prop("disabled", false);
              $(".shorten").prop("disabled", false);

              $("#longUrl").select();
              document.execCommand("copy");

              // Save to local storage
              saveToLocalStorage(data.short_url, data.origin_url);

              // Refresh history
              refreshHistoryArea();

              //generateQR(data.short_url);
            },
            error: function (xhr, status, error) {
              $("#loading").hide();
              
              if(xhr.responseJSON){
                $("#longUrk").addClass("is-invalid");
                $("#alertMessage").text(xhr.responseJSON.Errors.Url);
              }
              else{
                $("#alertMessage").text("Something went wrong!");
              }

              // Show alert
              $("#alert").addClass("show");

              // Disappear alert after 3 seconds
              setTimeout(function () {
                $("#alert").removeClass("show");
              }, 3000);

              // Enable input and button
              $("#longUrl").prop("disabled", false);
              $(".shorten").prop("disabled", false);
            },
          });
        });

        $("#longUrl").keyup(function(event) {
          if (event.keyCode === 13) {
            $(".shorten").click();
          }
        });

        $("#longUrl").keypress(function (t) {
          // Show shorten button
          $(".shorten").show();
          $(".copy").hide();

          $("#longUrl").removeClass("is-invalid");
        });
      });

            
      /*
       * A function for saving shorted urls to local storage
       * the storage will hold shortUrl, longUrl, and date
       * the storage will be used to show history
      */
      function saveToLocalStorage(shortUrl, longUrl) {
        // If shortUrl already exists in history, don't add it again
        const history = getHistoryFromLocalStorage() || [];
        if(history.find(data => data.shortUrl === shortUrl)){
          return;
        }

        const date = new Date().toLocaleString();
        const data = { shortUrl, longUrl, date };

        // Add to local storage to first index
        history.unshift(data);
        localStorage.setItem('history', JSON.stringify(history));

        refreshHistoryArea();
      }

      function getHistoryFromLocalStorage() {
        const history = JSON.parse(localStorage.getItem('history')) || [];
        return history;
      }

      function deleteFromLocalStorage(shortUrl) {
        const history = JSON.parse(localStorage.getItem('history')) || [];
        const updatedHistory = history.filter(data => data.shortUrl !== shortUrl);
        localStorage.setItem('history', JSON.stringify(updatedHistory));
      }

      function refreshHistoryArea() {
        const history = getHistoryFromLocalStorage();

        if(history.length > 0){
          $(".empty").hide();
          $("#history-area").show();
          buildHistoryList(history);
        }
        else{
          $(".empty").show();
          $("#history-area").hide();
        }
      }

      function copyToClipboard(text) {
        $("#longUrl").select();
        document.execCommand("copy");

        // Show alert
        $("#successtMessage").text("Copied!");
        $("#success").addClass("show");

        // Disappear alert after 3 seconds
        setTimeout(function () {
          $("#success").removeClass("show");
        }, 3000);
      }

      function generateQR(text){
        document.getElementById("qr").innerHTML = "";
        document.getElementById("qr").appendChild(QRCode.generateSVG(text));
      }

      function generateHtmlQR(){
          var qrData = QRCode.generate(t.target.value);

          var qrContainer = $("#qr")[0];
          qrContainer.innerHTML = "";

          var relativeCellWidth = (100 / qrData.length);

          for (var y = 0; y < qrData.length; y++) {
            for (var x = 0; x < qrData[y].length; x++) {
              var cell = document.createElement("div");
              cell.style.width = relativeCellWidth + "%";
              cell.style.height = relativeCellWidth + "%";
              cell.style.position = "absolute";
              cell.style.left = x * relativeCellWidth + "%";
              cell.style.top = y * relativeCellWidth + "%";
              cell.style.backgroundColor = qrData[x][y] === 1 ? "black" : "white";
              qrContainer.appendChild(cell);
            }
          }
      }

      function buildHistoryList(history) {
        // Create a table body with rows for each history item
        const tbody = $('#historyBody');
        tbody.html("");

        history.forEach(data => {
          const tr = document.createElement('tr');

          // Create a cell for the short URL with a clickable link
          const td1 = document.createElement('td');
          const a1 = document.createElement('a');
          a1.href = "https://" + data.shortUrl;
          a1.textContent = data.shortUrl;
          a1.target = "_blank";
          td1.appendChild(a1);

          // Create a cell for the long URL with a clickable link
          const td2 = document.createElement('td');
          const a2 = document.createElement('a');
          a2.href = data.longUrl;
          a2.textContent = data.longUrl;
          a2.target = "_blank";
          td2.appendChild(a2);
          td2.style.wordBreak = 'break-word';

          // Create a cell for the date
          const td3 = document.createElement('td');
          td3.classList = ["d-none d-sm-table-cell"]
          td3.textContent = data.date;

          // Create a cell for the remove button
          const td4 = document.createElement('td');
          td4.classList.add('p-0');
          td4.style.whiteSpace = 'nowrap';
          const removeBtn = document.createElement('button');
          removeBtn.classList.add('btn', 'btn-ghost-danger', 'm-sm-1', 'p-sm-1', 'p-0');
          removeBtn.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" class="icon icon-tabler icon-tabler-trash m-0" width="24" height="24" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" fill="none" stroke-linecap="round" stroke-linejoin="round"><path stroke="none" d="M0 0h24v24H0z" fill="none"></path><path d="M4 7l16 0"></path><path d="M10 11l0 6"></path><path d="M14 11l0 6"></path><path d="M5 7l1 12a2 2 0 0 0 2 2h8a2 2 0 0 0 2 -2l1 -12"></path><path d="M9 7v-3a1 1 0 0 1 1 -1h4a1 1 0 0 1 1 1v3"></path></svg>';
            
          // Add an event listener to the remove button to delete the history item and remove the row
          removeBtn.addEventListener('click', () => {
            // Ask for confirmation
            if(!confirm("Are you sure you want to delete this record?")){
              return;
            }

            deleteFromLocalStorage(data.shortUrl);
            tr.remove();

            // Refresh history
            refreshHistoryArea();
          });
          
          // Add show QR button for short url, will show QR code in a modal
          const qrBtn = document.createElement('button');
          qrBtn.classList.add('btn', 'btn-ghost-primary', 'm-sm-1', 'p-sm-1', 'p-0');
          qrBtn.innerHTML='<svg xmlns="http://www.w3.org/2000/svg" class="icon icon-tabler icon-tabler-qrcode m-0" width="24" height="24" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" fill="none" stroke-linecap="round" stroke-linejoin="round"><path stroke="none" d="M0 0h24v24H0z" fill="none"></path><path d="M4 4m0 1a1 1 0 0 1 1 -1h4a1 1 0 0 1 1 1v4a1 1 0 0 1 -1 1h-4a1 1 0 0 1 -1 -1z"></path><path d="M7 17l0 .01"></path><path d="M14 4m0 1a1 1 0 0 1 1 -1h4a1 1 0 0 1 1 1v4a1 1 0 0 1 -1 1h-4a1 1 0 0 1 -1 -1z"></path><path d="M7 7l0 .01"></path><path d="M4 14m0 1a1 1 0 0 1 1 -1h4a1 1 0 0 1 1 1v4a1 1 0 0 1 -1 1h-4a1 1 0 0 1 -1 -1z"></path><path d="M17 7l0 .01"></path><path d="M14 14l3 0"></path><path d="M20 14l0 .01"></path><path d="M14 14l0 3"></path><path d="M14 20l3 0"></path><path d="M17 17l3 0"></path><path d="M20 17l0 3"></path></svg>';
          qrBtn.addEventListener('click', () => {
            generateQR(data.shortUrl);
            $("#qrModal").modal('show');
          });

          // Add show QR button for short url, will show QR code in a modal
          const copyBtn = document.createElement('button');
          copyBtn.classList.add('btn', 'btn-ghost-green', 'm-sm-1', 'p-sm-1', 'p-0');
          copyBtn.innerHTML='<svg xmlns="http://www.w3.org/2000/svg" class="icon icon-tabler icon-tabler-copy m-0" width="24" height="24" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" fill="none" stroke-linecap="round" stroke-linejoin="round"><path stroke="none" d="M0 0h24v24H0z" fill="none"></path><path d="M8 8m0 2a2 2 0 0 1 2 -2h8a2 2 0 0 1 2 2v8a2 2 0 0 1 -2 2h-8a2 2 0 0 1 -2 -2z"></path><path d="M16 8v-2a2 2 0 0 0 -2 -2h-8a2 2 0 0 0 -2 2v8a2 2 0 0 0 2 2h2"></path></svg>';
          copyBtn.addEventListener('click', () => {
            copyToClipboard($("#longUrl").val());
          });

          td4.appendChild(removeBtn);
          td4.appendChild(qrBtn);
          td4.appendChild(copyBtn);

          // Add all cells to the row and add the row to the table body
          tr.appendChild(td1);
          tr.appendChild(td2);
          tr.appendChild(td3);
          tr.appendChild(td4);
          tbody.append(tr);
        });
      }
    </script>
